[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "localmask"
version = "0.9.9"
description = "Privacy-first secret detection & masking for code repositories. 100% local — secrets never leave your machine."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "python-multipart>=0.0.6",
    "pydantic>=2.4.0",
    "pyyaml>=6.0.1",
    "gitpython>=3.1.40",
    "requests>=2.31.0",
    "mcp>=1.28.0",
]

[project.optional-dependencies]
ner = ["spacy>=3.7.0"]
askai = ["anthropic>=0.25.0", "openai>=1.12.0"]
org = ["redis>=5.0.0"]

[project.scripts]
localmask = "cli:main"

[tool.ruff.lint]
ignore = [
    "BLE001",  # broad Exception catches are intentional (CLI must not crash)
    "S110",    # try/except/pass used for optional-feature probing
    "S112",    # try/except/continue — same rationale
    "N999",    # module names match CLI conventions, not PEP 8
    "RUF012",  # mutable class defaults are fine for dataclass-style usage
    "RUF013",  # implicit Optional — legacy style, not worth mass-rewriting
    "B023",    # loop variable binding in closures — reviewed, intentional
    "ASYNC210",  # async file I/O — not applicable to sync code paths
    "ASYNC230",  # async subprocess — same
    "ISC004",  # implicit string concat in collection — readable as-is
    "I001",    # import sorting — handled by auto-fix, residual is intentional grouping
]

[tool.setuptools]
packages = ["localmask"]
py-modules = [
    "cli", "server", "server_core", "mcp_server",
    "regex_rules_safe", "sensitivity_classifier", "ner_scanner",
    "detector_pipeline", "licensing", "org_rules",
    "rehydration_engine", "safe_scanner",
]
