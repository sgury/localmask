[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "localmask"
version = "0.9.8"
description = "Privacy-first secret detection & masking for code repositories. 100% local — secrets never leave your machine."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "python-multipart>=0.0.6",
    "pydantic>=2.4.0",
    "pyyaml>=6.0.1",
    "gitpython>=3.1.40",
    "requests>=2.31.0",
    "mcp>=1.28.0",
]

[project.optional-dependencies]
ner = ["spacy>=3.7.0"]
askai = ["anthropic>=0.25.0", "openai>=1.12.0"]
org = ["redis>=5.0.0"]

[project.scripts]
localmask = "cli:main"

[tool.setuptools]
packages = ["localmask"]
py-modules = [
    "cli", "server", "server_core", "mcp_server",
    "regex_rules_safe", "sensitivity_classifier", "ner_scanner",
    "detector_pipeline", "licensing", "org_rules",
    "rehydration_engine", "safe_scanner",
]
